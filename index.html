<!-- Four regions. Only #scrollback scrolls; the other three are pinned by
     flex-shrink:0 in layout.css. JS only ever appends to #scrollback. -->
<div id="app">

  <header id="statusbar">
    <span class="tag">PORTFOLIO</span>
    <span id="sb-section">~</span>
    <span class="sb-spacer"></span>
    <span id="sb-clock"></span>
  </header>

  <main id="scrollback" tabindex="-1" aria-live="polite" aria-label="Command output"></main>

  <div id="promptbar">
    <label id="ps1" for="input">$</label>
    <input id="input"
           autocomplete="off" autocorrect="off" autocapitalize="off"
           spellcheck="false" enterkeyhint="go"
           aria-label="Type a command">
  </div>

  <footer id="keybinds">
    <span><kbd>Tab</kbd> complete</span>
    <span><kbd>&uarr;</kbd><kbd>&darr;</kbd> history</span>
    <span><kbd>Ctrl</kbd>+<kbd>L</kbd> clear</span>
  </footer>

</div>

<!-- Read by search engines and anyone with JS disabled. Nothing above this
     point contains a word of your actual content, so without this block the
     page is empty to a crawler. Keep it in sync when you add a section. -->
